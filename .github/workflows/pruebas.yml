name: Pruebas

on:
  pull_request:
    branches: [preview, main]
  push:
    branches: [preview]

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buzón de feedback y puerta del staging
        run: node --test test/*.test.mjs
